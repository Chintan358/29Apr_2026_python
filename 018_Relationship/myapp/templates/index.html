<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, .2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        textarea {
            resize: none;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            width: 30%;
            padding: 12px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            width: 30%;
            padding: 12px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }



        .submit-btn {
            background: #28a745;
        }

        .submit-btn:hover {
            background: #218838;
        }

        .reset-btn {
            background: #dc3545;
        }

        .reset-btn:hover {
            background: #c82333;
        }

        .display-btn {
            background: #007bff;
        }

        .display-btn:hover {
            background: black;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Product Registration</h2>

        <form action="" method="post" enctype="multipart/form-data">
            {%csrf_token%}
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" placeholder="Enter Product Name" required>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="number" name="price" placeholder="Enter Price" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="qty" placeholder="Enter Quantity" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="">-- Select Category --</option>

                    {%for cat in categories%}
                    <option value="{{cat.id}}">{{cat.name}}</option>
                    {%endfor%}
                </select>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="image" accept="image/*">
            </div>



            <div class="btn-group">
                <button type="submit" class="submit-btn">Save Product</button>
                <button type="reset" class="reset-btn">Reset</button>
                <a href="{%url 'display'%}" class="display-btn">Display</a>
            </div>

        </form>

    </div>

</body>

</html>
