<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px 15px 0 0 !important;
        }

        .btn-register {
            width: 100%;
            font-size: 18px;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card registration-card mx-auto">

            <div class="card-header">
                Student Registration
            </div>

            <div class="card-body p-4">
                <span class="text-success">{{msg}}</span>
                <form action="{%url 'create'%}" method="post">
                    {%csrf_token%}
                    <input type="hidden" value="{{student.id}}" name="id">
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" placeholder="Enter Full Name" name="name"
                            value="{{student.name}}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter Email" name="email"
                            value="{{student.email}}">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" placeholder="Enter Age" name="age"
                            value="{{student.age}}">
                    </div>


                    <button type="submit" class="btn btn-primary btn-register">
                        {%if student%}
                        Update Student
                        {%else%}
                        Register Student
                        {%endif%}
                    </button>


                    <button type="reset" class="btn btn-outline-secondary btn-register mt-2">
                        Reset
                    </button>

                    <a href="{%url 'display'%}" class="btn btn-outline-primary mt-2">Display</a>

                </form>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
