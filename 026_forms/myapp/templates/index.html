<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="post">
        {%csrf_token%}
        {{form.as_p}}
        <input type="submit">
    </form>

    <br>
    <hr>
    <br>
    <table border="1">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th colspan="2">Action</th>
        </tr>
        {%for product in products%}
        <tr>
            <td>{{product.id}}</td>
            <td>{{product.name}}</td>
            <td>{{product.price}}</td>
            <td>{{product.qty}}</td>
            <td><a href="{%url 'delete'%}?id={{product.id}}">Delete</a></td>
            <td><a href="{%url 'update'%}?id={{product.id}}">Update</a></td>
        </tr>
        {%endfor%}
    </table>
</body>

</html>
